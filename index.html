<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tentang Suka</title>

<style>
@font-face {
    font-family: Montserrat;
    src: url("Montserrat-SemiBold.otf");
}

@font-face {
    font-family: Faber;
    src: url("FaberSerifReduced56.otf");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f1eb;
    color: #171717;
    font-family: Montserrat, sans-serif;
}

header {
    padding: 35px 22px 25px;
    text-align: center;
}

.logo {
    font-family: Faber, serif;
    font-size: 42px;
    letter-spacing: -1px;
}

.subtitle {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: .6;
}

.hero {
    padding: 10px 18px 30px;
}

.hero img {
    width: 100%;
    display: block;
    border-radius: 2px;
}

.menu {
    padding: 20px 22px 50px;
}

.menu-title {
    font-family: Faber, serif;
    font-size: 32px;
    margin-bottom: 20px;
}

.card {
    margin-bottom: 28px;
}

.card img {
    width: 100%;
    display: block;
}

.card h2 {
    font-family: Faber, serif;
    font-size: 25px;
    margin: 13px 0 5px;
}

.card p {
    font-size: 12px;
    line-height: 1.7;
    opacity: .7;
    margin: 0;
}

footer {
    padding: 30px 20px 45px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: .55;
}
</style>
</head>

<body>

<header>
    <div class="logo">SUKA</div>
    <div class="subtitle">Menu 2026</div>
</header>

<section class="hero">
    <img src="dilema.jpg" alt="Suka">
</section>

<section class="menu">

    <div class="menu-title">Our Menu</div>

    <div class="card">
        <img src="doc1.jpg" alt="Menu Suka">
        <h2>Menu Suka</h2>
        <p>
            Temukan pilihan menu Suka dengan karakter rasa
            yang dibuat untuk dinikmati perlahan.
        </p>
    </div>

    <div class="card">
        <img src="doc2.jpg" alt="Menu Suka">
        <h2>Something Special</h2>
        <p>
            Pilihan spesial untuk menemani momen kecil
            menjadi lebih berkesan.
        </p>
    </div>

</section>

<footer>
    TENTANG SUKA · 2026
</footer>

</body>
  </html>
